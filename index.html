<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Study Planner</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

</head>
<body>

     <!-- Moving Background Particles -->
    <div class="ambient-bg" id="particles"></div>

    <!-- Theme Toggle -->
    <button style="position: fixed; bottom: 1.5rem; right: 1.5rem; width: 3rem; height: 3rem; border-radius: 50%; background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-light); z-index: 60;" onclick="toggleTheme()">
        <i class="fas fa-adjust"></i>
    </button>

    <!-- PAGE 1: WELCOME & REALISTIC PLANT -->
    <section id="page-welcome" class="page-container">
        
        <div class="top-bar">
            <div class="streak-pill fade-in">
                <i class="fas fa-leaf"></i>
                <span id="streak-counter">0 Days</span>
            </div>
        </div>

        <div style="text-align: center; margin-bottom: 2rem; z-index: 10;" class="fade-in">
            <h1 style="font-size: 4rem; font-weight: 800; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; color: transparent; margin-bottom: 0.5rem;">
                Morning Aura
            </h1>
            <p style="font-size: 1.3rem; opacity: 0.8;" id="guide-text">Nurture your daily growth.</p>
        </div>

        <!-- REALISTIC PLANT -->
        <div class="plant-stage fade-in" style="animation-delay: 0.2s;">
            <!-- Bottle -->
            <div id="water-bottle-wrap" class="water-bottle-container">
                <img src="https://cdn-icons-png.flaticon.com/512/3105/3105807.png" class="water-bottle-img" alt="Water Bottle">
                <div class="water-drops">
                    <div class="drop"></div>
                    <div class="drop" style="animation-delay: 0.1s;"></div>
                    <div class="drop" style="animation-delay: 0.2s;"></div>
                    <div class="drop" style="animation-delay: 0.3s;"></div>
                </div>
            </div>

            <!-- Plant Structure -->
            <div class="plant-structure" id="plant-structure">
                <div id="main-stem" class="main-stem"></div>
                <!-- Branches injected via JS -->
            </div>

            <!-- Soil Land Base -->
            <div class="soil-land"></div>
        </div>

        <!-- Buttons -->
        <button id="btn-water" class="btn-primary fade-in" onclick="waterPlant()">
            <i class="fas fa-tint"></i> Water Plant
        </button>

        <button id="btn-enter" class="btn-primary hidden" onclick="enterPlanner()">
            Plan Day <i class="fas fa-arrow-right"></i>
        </button>

        <!-- Quote -->
        <div id="quote-area" class="quote-box">
            <p id="quote-txt" class="quote-text">Loading...</p>
            <p id="quote-by" class="quote-author">...</p>
        </div>
    </section>

    <!-- PAGE 2: PLANNER -->
    <section id="page-planner" class="planner-container hidden">
        <div class="header-row fade-in">
            <div class="flex center" style="gap: 1rem;">
                <div style="background: var(--accent); width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: white;">
                    <i class="fas fa-layer-group"></i>
                </div>
                <div>
                    <h2 style="font-size: 2rem; font-weight: 800; margin: 0;">Daily Matrix</h2>
                    <p style="opacity: 0.7; font-size: 1rem;" id="date-display">Today</p>
                </div>
            </div>
            <button onclick="showLogoutModal()" class="logout-btn">
                <i class="fas fa-check-circle"></i> Complete & Logout
            </button>
        </div>

        <div class="planner-main-content">
            <!-- SIDEBAR -->
            <div class="glass input-wrap fade-in" style="animation-delay: 0.1s;">
                <h3 style="font-size: 1.5rem; font-weight: 800; color: var(--accent);">New Task</h3>
                <input type="text" id="inp-task" class="big-input" placeholder="Task Name...">
                
                <div class="flex" style="gap: 1rem;">
                    <input type="number" id="inp-time" class="big-input" placeholder="Min" style="width: 100px; text-align: center;">
                    
                    <!-- Swipe Toggles -->
                    <div class="toggle-group" style="flex: 1;">
                        <div class="swipe-toggle" id="tg-urgent" onclick="toggleSwitch('urgent')">
                            <div class="toggle-knob"><i class="fas fa-fire"></i></div>
                            <div class="toggle-label">Urgent</div>
                        </div>
                        <div class="swipe-toggle" id="tg-vital" onclick="toggleSwitch('vital')">
                            <div class="toggle-knob"><i class="fas fa-star"></i></div>
                            <div class="toggle-label">Vital</div>
                        </div>
                    </div>
                </div>

                <button onclick="addNewTask()" class="btn-primary" style="justify-content: center; width: 100%; margin-top: 0.5rem;">Add Node</button>

                <div style="margin-top: 2rem; flex: 1; overflow-y: auto;">
                    <h4 style="margin-bottom: 1rem; font-size: 1.2rem; opacity: 0.7;">Queue</h4>
                    <div id="agenda-list"></div>
                </div>
            </div>

            <!-- MATRIX -->
            <div class="matrix-grid fade-in" style="animation-delay: 0.2s;">
                <div class="glass matrix-box" style="border-top: 6px solid #ec4899;">
                    <div style="font-weight: 800; font-size: 1.2rem; color: #ec4899; margin-bottom: 1rem;">DO FIRST</div>
                    <div id="q1"></div>
                </div>
                <div class="glass matrix-box" style="border-top: 6px solid #3b82f6;">
                    <div style="font-weight: 800; font-size: 1.2rem; color: #3b82f6; margin-bottom: 1rem;">SCHEDULE</div>
                    <div id="q2"></div>
                </div>
                <div class="glass matrix-box" style="border-top: 6px solid #f59e0b;">
                    <div style="font-weight: 800; font-size: 1.2rem; color: #f59e0b; margin-bottom: 1rem;">DELEGATE</div>
                    <div id="q3"></div>
                </div>
                <div class="glass matrix-box" style="border-top: 6px solid #94a3b8;">
                    <div style="font-weight: 800; font-size: 1.2rem; color: #94a3b8; margin-bottom: 1rem;">ELIMINATE</div>
                    <div id="q4"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- PAGE 3: SUMMARY -->
    <section id="page-summary" class="summary-overlay hidden">
        <div class="glass fade-in" style="padding: 3rem; text-align: center; border: 2px solid #10b981; max-width: 400px; margin: auto;">
            <div style="width: 80px; height: 80px; border-radius: 50%; background: #10b981; color: white; display: flex; align-items: center; justify-content: center; font-size: 3rem; margin: 0 auto 1.5rem;">
                <i class="fas fa-check"></i>
            </div>
            <h1 style="font-size: 2rem; margin-bottom: 0.5rem; font-weight: 800;">Day Complete</h1>
            <p style="font-size: 1rem; opacity: 0.8; margin-bottom: 2rem;">See you tomorrow! 😊</p>
            <p style="font-size: 0.8rem; opacity: 0.5;">Redirecting...</p>
        </div>
    </section>

    <!-- LOGOUT MODAL -->
    <div id="logout-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h3 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 1rem;">Finish the Day?</h3>
            <p style="opacity: 0.8; margin-bottom: 2rem;">This will complete today's session and start a new growth cycle.</p>
            <div class="modal-actions">
                <button onclick="closeModal('logout-modal')" class="btn-cancel">Cancel</button>
                <button onclick="confirmLogout()" class="btn-confirm">Yes, Finish</button>
            </div>
        </div>
    </div>

</body>
</html>
